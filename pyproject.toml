[project]
name = "finance-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.34",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "prefect>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "python-dotenv>=1.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["part2_pipeline/tests"]
pythonpath = ["part2_pipeline/src"]
addopts = "--strict-markers"
markers = [
    "aws: requires real AWS credentials and applied aws/ infrastructure",
    "localstack: requires a running LocalStack with buckets applied",
]
